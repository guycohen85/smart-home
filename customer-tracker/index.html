html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0}

.card-h b{font-size:16.5px}

.pill.warn{background:var(--warn-bg);color:var(--warn-fg)}

.grp:last-child{border-bottom:0}
.grp h3{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.kv{display:grid;grid-template-columns:minmax(0,42%) minmax(0,58%);gap:2px 10px;padding:3px 0;font-size:14px}
.kv span:first-child{color:var(--soft)}
.kv span:last-child{overflow-wrap:anywhere}
.kv .empty{color:var(--muted)}
.seg{display:flex;gap:0;margin-bottom:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:max-content;max-width:100%}
.seg button{border:0;background:var(--card);color:var(--soft);font:inherit;font-size:13.5px;padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top;white-space:nowrap}
th{background:var(--head);color:var(--head-fg);font-weight:600;position:sticky;top:0}
td.wrap,th.wrap{white-space:normal;min-width:180px}
tr:nth-child(even) td{background:var(--row)}
.list .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.list .row:last-child{border-bottom:0}
.list .row span:first-child{font-size:14px}
.gh{padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);background:var(--row);border-bottom:1px solid var(--line)}
.prog{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.prog b{font-size:22px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sum b{display:block;font-size:22px}
.sum span{font-size:13px;color:var(--soft)}
.leg p{margin:0 0 10px}
.leg h3{margin:16px 0 6px;font-size:15px}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
</style>

 ['זיהוי',['מזהה לקוח','שם לקוח','טלפון','עיר / אזור']],
 ['חבילה ותשלום',['חבילה','מחיר חבילה','תוספות / הנחה (₪)','מחיר בפועל','ריטיינר חודשי','תחילת ריטיינר (= אישור קבלה)']],
 ['תשלומים',['מקדמה בחתימה','תאריך שולמה מקדמה','אפשר להזמין ציוד?','תאריך שולמה יתרה','יתרה לגבייה']],
 ['רווחיות',['עלות חומרה (כולל מע"מ)','עלות חשמלאי','רווח התקנה (לפני שכר עצמי)','שעות התקנה (כולל נסיעות)','רווח התקנה לשעה','שעות תמיכה (ריטיינר)']],
 ['לוח זמנים',['תאריך סקר בית','תאריך התקנה','תאריך אישור קבלה','התקדמות checklist']],
 ['פרטים טכניים',['IP קבוע','MAC של ה-HA','גרסת HA','Nabu Casa','שירותי Nabu Casa שנבחרו','שם bucket ב-R2','מזהה ניטור']],
 ['עבודת חשמל',['עבודת חשמל','חשמלאי']],
 ['פניות',['פניות פתוחות']],
 ['סודות והערות',['הפניה לסודות (מנהל סיסמאות)','הערות']]
];
let tab='cust', custView='cards';
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function pillFor(v){const p=el('span','pill',v);
  if(v==='✓'||v==='פעיל'||v==='סגורה')p.classList.add('ok');
  else if(v==='✗'||v==='קריטית')p.classList.add('bad');
  else if(v==='פתוחה')p.classList.add('warn');
  return p}
function table(head,rows,wrapCols=[]){
  const s=el('div','scroll'),t=el('table'),th=el('thead'),tr=el('tr');
  head.forEach((h,i)=>{const c=el('th',wrapCols.includes(i)?'wrap':'',h);tr.appendChild(c)});
  th.appendChild(tr);t.appendChild(th);const tb=el('tbody');
  rows.forEach(r=>{const x=el('tr');r.forEach((v,i)=>x.appendChild(el('td',wrapCols.includes(i)?'wrap':'',v===''?'—':v)));tb.appendChild(x)});
  t.appendChild(tb);s.appendChild(t);return s}
function note(){return el('div','note','כל הנתונים כאן הם דוגמה (לקוח C001, לא אמיתי).')}
function renderCust(m){
  m.appendChild(note());
  const seg=el('div','seg');
  [['cards','כרטיסים'],['table','טבלה מלאה']].forEach(([k,l])=>{
    const b=el('button','',l);b.setAttribute('aria-pressed',custView===k);b.onclick=()=>{custView=k;render()};seg.appendChild(b)});
  m.appendChild(seg);
  if(custView==='table'){m.appendChild(el('p','hint','גללו הצידה כדי לראות את כל העמודות.'));m.appendChild(table(D.H,D.cust,[]));return}
  D.cust.forEach(r=>{
    const c=el('div','card'),h=el('div','card-h'),l=el('div');
    l.appendChild(el('b','',r[1]));l.appendChild(el('small','',r[0]+' · '+r[D.H.indexOf('חבילה')]));
    h.appendChild(l);h.appendChild(pillFor(r[D.H.indexOf('סטטוס')]));c.appendChild(h);
    GROUPS.forEach(([name,names])=>{
      const g=el('div','grp');g.appendChild(el('h3','',name));
      names.forEach(n=>{const i=D.H.indexOf(n);if(i<0)return;const kv=el('div','kv');kv.appendChild(el('span','',n));
        const v=el('span',r[i]===''?'empty':'',r[i]===''?'—':r[i]);kv.appendChild(v);g.appendChild(kv)});
      c.appendChild(g)});
    m.appendChild(c)})}
function renderChk(m){
  m.appendChild(note());
  D.ids.forEach((id,j)=>{
    const c=el('div','card list');
    const p=el('div','prog');p.appendChild(el('b','',D.prog[j]));
    const t=el('div');t.appendChild(el('div','',id+' — התקדמות'));t.appendChild(el('small','','"לא רלוונטי" לא נספר באחוזים'));p.appendChild(t);c.appendChild(p);
    let last='';
    D.items.forEach(it=>{
      if(it.g!==last){c.appendChild(el('div','gh',it.g));last=it.g}
      const r=el('div','row');r.appendChild(el('span','',it.t));r.appendChild(pillFor(it.v[j]||'—'));c.appendChild(r)});
    m.appendChild(c)})}
function renderHrs(m){
  m.appendChild(note());
  const SUP='תמיכה (ריטיינר)';
  const sum=f=>D.hours.filter(f).reduce((a,r)=>a+(parseFloat(r[3])||0),0);
  const s=el('div','sum');
  [[sum(r=>r[1]!==SUP).toFixed(1),'שעות התקנה (כולל נסיעות)'],[sum(r=>r[1]===SUP).toFixed(1),'שעות תמיכה (ריטיינר)']].forEach(([n,l])=>{
    const a=el('div');a.appendChild(el('b','',n));a.appendChild(el('span','',l));s.appendChild(a)});
  m.appendChild(s);
  m.appendChild(table(['לקוח','שלב','תאריך','שעות','הערה'],D.hours,[4]))}
function renderIss(m){
  m.appendChild(note());
  D.issues.forEach(r=>{
    const c=el('div','card'),h=el('div','card-h'),l=el('div');
    l.appendChild(el('b','',r[3]));l.appendChild(el('small','',r[0]+' · '+r[1]+' · '+r[2]));
    h.appendChild(l);h.appendChild(pillFor(r[5]));c.appendChild(h);
    const g=el('div','grp');
    [['חומרה',r[4]],['תגובה ראשונה',r[6]],['יעד SLA לתגובה',r[9]],['עמד ב-SLA?',r[10]],['תאריך פתרון',r[7]],['זמן פתרון (שעות)',r[8]],['הערות',r[11]]].forEach(([k,v])=>{
      const kv=el('div','kv');kv.appendChild(el('span','',k));
      const val=el('span',v===''?'empty':'',v===''?'—':v);kv.appendChild(val);g.appendChild(kv)});
    c.appendChild(g);m.appendChild(c)})}
function renderPkg(m){
  const s=el('div','sum');
  D.sm.forEach(([k,v])=>{const d=el('div');d.appendChild(el('b','',String(v)));d.appendChild(el('span','',k));s.appendChild(d)});
  m.appendChild(s);
  m.appendChild(table(['חבילה','מחיר התקנה','ריטיינר חודשי'],D.pk));
  m.appendChild(el('p','hint','מקור המחירים: PRD 1, תמחור מעודכן ב-16/09/2026.'))}
function renderLeg(m){
  const c=el('div','card'),b=el('div','grp leg');
  D.leg.forEach((t,i)=>{ if(t===null||t==='')return; if(i===0)return;
    const short=t.length<40&&!t.includes('.');
    b.appendChild(el(short?'h3':'p','',t))});
  c.appendChild(b);m.appendChild(c)}
function render(){
  const tabs=document.getElementById('tabs');tabs.innerHTML='';
  TABS.forEach(([k,l])=>{const b=el('button','tab',l);b.setAttribute('role','tab');b.setAttribute('aria-selected',tab===k);
    b.onclick=()=>{tab=k;render();window.scrollTo(0,0)};tabs.appendChild(b)});
  const m=document.getElementById('main');m.innerHTML='';
  ({cust:renderCust,chk:renderChk,hrs:renderHrs,iss:renderIss,pkg:renderPkg,leg:renderLeg})[tab](m)}
render();
</script>
</body>
</html>
